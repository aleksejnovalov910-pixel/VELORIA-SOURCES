name: VELORIA Build
on:
  push:
    branches: [veloria-core-v0.1]
    paths: ['VELORIA-RP/**','.github/workflows/veloria-build.yml']
  pull_request:
    paths: ['VELORIA-RP/**','.github/workflows/veloria-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VELORIA-RP
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server/client dependencies
        run: npm install
      - name: Install CEF dependencies
        run: npm --prefix src/cef install
      - name: Typecheck
        run: npm run typecheck
      - name: Build deploy bundle
        run: npm run build
      - name: Validate deploy layout
        run: |
          test -f deploy/conf.json
          test -f deploy/packages/veloria/index.js
          test -f deploy/client_packages/index.js
          test -f deploy/client_packages/veloria/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: veloria-deploy
          path: VELORIA-RP/deploy
          if-no-files-found: error
