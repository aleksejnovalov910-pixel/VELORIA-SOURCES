name: VELORIA Build

on:
  workflow_dispatch:
  push:
    branches:
      - veloria-core-v0.1
    paths:
      - 'VELORIA-RP/**'
      - '.github/workflows/veloria-build.yml'
  pull_request:
    paths:
      - 'VELORIA-RP/**'
      - '.github/workflows/veloria-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 'root'
          MYSQL_DATABASE: 'veloria'
          MYSQL_USER: 'veloria'
          MYSQL_PASSWORD: 'veloria_ci'
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    defaults:
      run:
        working-directory: VELORIA-RP

    env:
      MYSQL_HOST: '127.0.0.1'
      MYSQL_PORT: '3306'
      MYSQL_USER: 'veloria'
      MYSQL_PASSWORD: 'veloria_ci'
      MYSQL_DATABASE: 'veloria'
      REDIS_HOST: '127.0.0.1'
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment diagnostics
        run: |
          set -o pipefail
          { node --version; npm --version; } 2>&1 | tee ci-environment.log

      - name: Install server/client dependencies
        run: |
          set -o pipefail
          npm install --include=dev --no-audit --no-fund 2>&1 | tee ci-install-root.log

      - name: Install CEF dependencies
        run: |
          set -o pipefail
          npm --prefix src/cef install --include=dev --no-audit --no-fund 2>&1 | tee ci-install-cef.log

      - name: Dependency smoke test
        id: deps_smoke
        continue-on-error: true
        run: |
          set -o pipefail
          npm run deps:smoke 2>&1 | tee ci-deps-smoke.log

      - name: Typecheck server
        id: typecheck_server
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck:server 2>&1 | tee ci-typecheck-server.log

      - name: Typecheck client
        id: typecheck_client
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck:client 2>&1 | tee ci-typecheck-client.log

      - name: Typecheck CEF
        id: typecheck_cef
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck:cef 2>&1 | tee ci-typecheck-cef.log

      - name: Migration smoke test
        id: migrate
        continue-on-error: true
        run: |
          set -o pipefail
          npm run migrate 2>&1 | tee ci-migrate.log

      - name: Build deploy bundle
        id: build_bundle
        if: steps.deps_smoke.outcome == 'success' && steps.typecheck_server.outcome == 'success' && steps.typecheck_client.outcome == 'success' && steps.typecheck_cef.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log

      - name: Validate deploy layout
        id: deploy_layout
        if: steps.build_bundle.outcome == 'success'
        continue-on-error: true
        run: |
          set -euxo pipefail
          test -f deploy/conf.json
          test -f deploy/.env.example
          test -f deploy/package.json
          test -f deploy/scripts/migrate.mjs
          test -f deploy/scripts/dependency-smoke.mjs
          test -f deploy/scripts/host-preflight.mjs
          test -f deploy/packages/veloria/index.js
          test -f deploy/packages/veloria/server/index.js
          test -f deploy/client_packages/index.js
          test -f deploy/client_packages/veloria/index.html
          test -f deploy/client_packages/veloria/runtime/client/index.js

      - name: Validate deploy runtime
        id: deploy_runtime
        if: steps.deploy_layout.outcome == 'success'
        continue-on-error: true
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          npm --prefix deploy install --omit=dev --no-audit --no-fund 2>&1 | tee ci-deploy-runtime.log
          npm --prefix deploy run preflight 2>&1 | tee -a ci-deploy-runtime.log
          npm --prefix deploy run deps:smoke 2>&1 | tee -a ci-deploy-runtime.log
          npm --prefix deploy run migrate 2>&1 | tee -a ci-deploy-runtime.log

      - name: Publish diagnostic summary
        if: always()
        run: |
          {
            echo '## VELORIA CI diagnostics'
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| MySQL + Redis smoke | ${{ steps.deps_smoke.outcome }} |"
            echo "| Typecheck server | ${{ steps.typecheck_server.outcome }} |"
            echo "| Typecheck client | ${{ steps.typecheck_client.outcome }} |"
            echo "| Typecheck CEF | ${{ steps.typecheck_cef.outcome }} |"
            echo "| Migration | ${{ steps.migrate.outcome }} |"
            echo "| Build bundle | ${{ steps.build_bundle.outcome }} |"
            echo "| Deploy layout | ${{ steps.deploy_layout.outcome }} |"
            echo "| Deploy runtime + host preflight | ${{ steps.deploy_runtime.outcome }} |"
            echo
            for file in ci-environment.log ci-install-root.log ci-install-cef.log ci-deps-smoke.log ci-typecheck-server.log ci-typecheck-client.log ci-typecheck-cef.log ci-migrate.log ci-build.log ci-deploy-runtime.log; do
              if [ -f "$file" ]; then
                echo "### $file"
                echo '```text'
                tail -n 120 "$file"
                echo '```'
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veloria-ci-diagnostics
          path: |
            VELORIA-RP/ci-environment.log
            VELORIA-RP/ci-install-root.log
            VELORIA-RP/ci-install-cef.log
            VELORIA-RP/ci-deps-smoke.log
            VELORIA-RP/ci-typecheck-server.log
            VELORIA-RP/ci-typecheck-client.log
            VELORIA-RP/ci-typecheck-cef.log
            VELORIA-RP/ci-migrate.log
            VELORIA-RP/ci-build.log
            VELORIA-RP/ci-deploy-runtime.log
          if-no-files-found: ignore

      - name: Fail on validation errors
        if: always()
        run: |
          failed=0
          for result in \
            "${{ steps.deps_smoke.outcome }}" \
            "${{ steps.typecheck_server.outcome }}" \
            "${{ steps.typecheck_client.outcome }}" \
            "${{ steps.typecheck_cef.outcome }}" \
            "${{ steps.migrate.outcome }}" \
            "${{ steps.build_bundle.outcome }}" \
            "${{ steps.deploy_layout.outcome }}" \
            "${{ steps.deploy_runtime.outcome }}"; do
            if [ "$result" != "success" ]; then failed=1; fi
          done
          exit "$failed"

      - name: Upload deploy artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veloria-deploy
          path: VELORIA-RP/deploy
          if-no-files-found: error
