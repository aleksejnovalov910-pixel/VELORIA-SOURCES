name: VELORIA Build
on:
  push:
    branches: [veloria-core-v0.1]
    paths: ['VELORIA-RP/**','.github/workflows/veloria-build.yml']
  pull_request:
    paths: ['VELORIA-RP/**','.github/workflows/veloria-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VELORIA-RP
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            VELORIA-RP/package.json
            VELORIA-RP/src/cef/package.json
      - run: npm install
      - run: npm --prefix src/cef install
      - run: npm run typecheck
      - run: npm run build
